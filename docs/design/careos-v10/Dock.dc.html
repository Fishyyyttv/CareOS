<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 760px; height: 96px; display: flex; align-items: center; justify-content: center; font-family: Figtree, system-ui, sans-serif">
<nav aria-label="Dock" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 14px; border-radius: 26px; background: {{bg}}; border: 1px solid {{line}}; box-shadow: 0 18px 50px rgba(5,8,22,0.35); backdrop-filter: blur(28px)">
<sc-for list="{{left}}" as="item" hint-placeholder-count="1">
<button aria-label="{{item.label}}" style="position: relative; width: 56px; height: 56px; padding: 2px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<dc-import name="AppIcon" app="{{item.app}}" size="{{item.size}}" hint-size="52px,52px"></dc-import>
</button>
</sc-for>
<div style="width: 1px; height: 40px; background: {{line}}"></div>
<sc-for list="{{apps}}" as="item" hint-placeholder-count="7">
<button aria-label="{{item.label}}" style="position: relative; width: 56px; height: 56px; padding: 2px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<dc-import name="AppIcon" app="{{item.app}}" size="{{item.size}}" hint-size="52px,52px"></dc-import>
<sc-if value="{{item.on}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; bottom: -9px; left: 50%; margin-left: {{item.dotOffset}}; width: {{item.dotW}}; height: 5px; border-radius: 3px; background: {{item.dotColor}}"></span>
</sc-if>
</button>
</sc-for>
<div style="width: 1px; height: 40px; background: {{line}}"></div>
<button aria-label="Trash" style="width: 56px; height: 56px; padding: 2px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<dc-import name="AppIcon" app="trash" size="52" hint-size="52px,52px"></dc-import>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"active":{"editor":"enum","options":["none","terminal","files","browser","notes","editor","store","pet","settings"],"default":"terminal"},"running":{"editor":"text","default":"terminal,files"},"$preview":{"width":760,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var light = this.props.theme === 'light';
    var active = this.props.active || 'none';
    var running = String(this.props.running || '').split(',');
    var defs = [
      ['terminal', 'Terminal'], ['files', 'Files'], ['browser', 'Browser'], ['notes', 'Notes'],
      ['editor', 'Editor'], ['store', 'Packages'], ['pet', 'Pip’s Home'], ['settings', 'Settings']
    ];
    var apps = defs.map(function (d) {
      var isActive = d[0] === active;
      var isRunning = isActive || running.indexOf(d[0]) !== -1;
      return {
        app: d[0], label: d[1], size: 52, on: isRunning,
        dotW: isActive ? '18px' : '5px',
        dotOffset: isActive ? '-9px' : '-2.5px',
        dotColor: isActive ? '#FF7A59' : (light ? '#5A6178' : '#9AA3BD')
      };
    });
    return {
      left: [{ app: 'launcher', label: 'Launcher', size: 52 }],
      apps: apps,
      bg: light ? 'rgba(255,255,255,0.72)' : 'rgba(18,23,44,0.66)',
      line: light ? 'rgba(22,26,43,0.10)' : 'rgba(255,255,255,0.10)'
    };
  }
}
</script>
</body>
</html>
