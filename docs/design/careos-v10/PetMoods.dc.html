<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip moods</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}
@keyframes pip-bob{0%,100%{transform:none}50%{transform:translateY(-5px) scale(1.01,.99)}}
@keyframes pip-bounce{0%,100%{transform:none}15%{transform:scale(1.08,.92)}40%{transform:translateY(-20px) scale(.94,1.06)}65%{transform:scale(1.06,.94)}82%{transform:translateY(-2px) scale(.99,1.01)}}
@keyframes pip-droop{0%,100%{transform:none}50%{transform:translateY(5px) scale(1.04,.96) rotate(-2deg)}}
@keyframes pip-tilt{0%,100%{transform:none}30%{transform:rotate(-6deg)}70%{transform:rotate(6deg) translateY(-2px)}}
@keyframes pip-wobble{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes pip-hop{0%,100%{transform:none}25%{transform:translateY(-10px) rotate(-4deg)}50%{transform:translateY(-14px)}75%{transform:translateY(-6px) rotate(4deg)}}
@keyframes pip-breathe{0%,100%{transform:none}50%{transform:scale(1.04,.96)}}
@keyframes pip-jump{0%,100%{transform:none}12%{transform:scale(1.12,.86)}42%{transform:translateY(-32px) scale(.92,1.08)}70%{transform:scale(1.08,.92)}85%{transform:scale(.98,1.02)}}
@keyframes pip-sh-bob{0%,100%{transform:none}50%{transform:scale(.94)}}
@keyframes pip-sh-bounce{0%,100%{transform:none}15%{transform:scale(1.08)}40%{transform:scale(.7);opacity:.5}65%{transform:scale(1.06)}}
@keyframes pip-sh-hop{0%,100%{transform:none}50%{transform:scale(.78);opacity:.6}}
@keyframes pip-sh-jump{0%,100%{transform:none}12%{transform:scale(1.1)}42%{transform:scale(.55);opacity:.4}70%{transform:scale(1.08)}}
@keyframes pip-blink{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}
@keyframes pip-wave{0%,100%{transform:none}50%{transform:rotate(-38deg)}}
@keyframes pip-feet{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes pip-look{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pip-halo{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.7);opacity:0}}
@keyframes pip-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pip-float{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-28px);opacity:0}}
@keyframes pip-twinkle{0%,100%{transform:scale(.4);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes pip-aura{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.08);opacity:.95}}
@keyframes pip-tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 64px; background: #F3F0FF; color: #1A1630; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px; position: relative; overflow: hidden">
<div style="position: absolute; width: 600px; height: 600px; right: -200px; top: -260px; border-radius: 50%; background: #D9D1FF; filter: blur(60px)"></div>
<div style="position: absolute; width: 500px; height: 500px; left: -200px; bottom: -260px; border-radius: 50%; background: #FFE1D8; filter: blur(60px)"></div>

<div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #6E5CE0">Meet your desktop buddy</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 60px; line-height: 1; letter-spacing: -0.03em">Pip has feelings.</h1>
</div>
<p style="margin: 0; max-width: 460px; font-size: 16px; line-height: 1.5; color: #4A4566">Pip reacts to what’s happening on your computer. The little bulb on his antenna glows a different color for each mood.</p>
</div>

<div style="position: relative; flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="9">
<div style="border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(80,60,180,0.08); padding: 14px 22px 14px 14px; display: flex; align-items: center; gap: 12px; overflow: visible">
<div style="width: 156px; height: 156px; border-radius: 20px; background: {{m.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<dc-import name="Pet" mood="{{m.key}}" color="lilac" size="128" hint-size="128px,128px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{m.bulb}}; box-shadow: 0 0 8px {{m.bulb}}"></span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">{{m.label}}</span></span>
<span style="font-size: 14px; line-height: 1.45; color: #4A4566">{{m.when}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['idle', 'Chilling', 'Bobbing around and blinking when nothing much is going on.', '#8C9BFF', '#EEEAFF'],
      ['happy', 'Happy', 'You give him a pat, or something you started finishes.', '#FF8EC4', '#FFE9F3'],
      ['sad', 'Sad', 'A build fails, or he hasn’t seen you in ages. A pat fixes it.', '#6CB8FF', '#E6F3FD'],
      ['thinking', 'Thinking', 'While apps load, files copy or code compiles.', '#FFC24B', '#FFF5DD'],
      ['confused', 'Confused', 'Typos, unknown commands and error dialogs.', '#C08BFF', '#F3EAFF'],
      ['watching', 'Watching', 'His eyes follow your cursor as you move around.', '#3DD68C', '#E3F8EE'],
      ['playing', 'Playing', 'Out roaming: runs along the dock and hops over windows.', '#FF7A59', '#FFEDE7'],
      ['sleeping', 'Sleeping', 'After ten quiet minutes, or late at night.', '#5A6385', '#E9ECF5'],
      ['excited', 'Excited', 'Downloads finish, updates land, you come back after a break.', '#FFC24B', '#FFF5DD']
    ];
    return { moods: list.map(function (m) { return { key: m[0], label: m[1], when: m[2], bulb: m[3], bg: m[4] }; }) };
  }
}
</script>
</body>
</html>
