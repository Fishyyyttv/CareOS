<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS Wi-Fi menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0} a{color:#B7C1FF} a:hover{color:#FFFFFF}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B1020; color: #EEF1FA; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -200px; top: 220px; border-radius: 50%; background: #2C3FA8; opacity: 0.55; filter: blur(90px)"></div>
<div style="position: absolute; width: 620px; height: 620px; right: -120px; top: -180px; border-radius: 50%; background: #FF7A59; opacity: 0.30; filter: blur(100px)"></div>
<div style="position: absolute; width: 520px; height: 520px; right: 240px; bottom: -280px; border-radius: 50%; background: #7B61FF; opacity: 0.35; filter: blur(90px)"></div>
<div style="position: absolute; width: 1200px; height: 1200px; left: 420px; top: 120px; border-radius: 50%; border: 90px solid rgba(140,155,255,0.06)"></div>

<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="dark" app="Desktop" open="wifi" hint-size="1440px,40px"></dc-import>
</div>

<section aria-label="Wi-Fi" style="position: absolute; right: 190px; top: 50px; width: 340px; box-sizing: border-box; padding: 14px; border-radius: 24px; background: rgba(21,27,46,0.90); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(36px); box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">Wi-Fi</span>
<span style="width: 46px; height: 28px; border-radius: 14px; background: #FF7A59; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box" role="switch" aria-checked="true" aria-label="Wi-Fi on"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</div>
<div style="padding: 12px; border-radius: 16px; background: rgba(255,122,89,0.14); display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #FF7A59; color: #2A120A; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 18px; height: 18px"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0M9.2 16a4.6 4.6 0 0 1 5.6 0M12 19.5h.01"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Fishbowl 5G</span><span style="font-size: 12px; color: #D5DAEA">Connected · 433 Mbps</span></span>
<button aria-label="Network details" style="width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; color: #D5DAEA; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA3BD; padding: 8px 6px 2px">Other networks</span>
<button style="height: 48px; padding: 0 12px; border-radius: 14px; border: 0; background: #2A3358; color: #EEF1FA; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 20px; height: 20px"><path d="M9.2 16a4.6 4.6 0 0 1 5.6 0M12 19.5h.01M5.8 12.5a9.5 9.5 0 0 1 12.4 0"></path><path d="M2.5 9a14 14 0 0 1 19 0" stroke-opacity="0.3"></path></svg>
<span style="flex: 1; font-weight: 600; font-size: 14px">NETGEAR-22</span><svg viewBox="0 0 24 24" fill="none" stroke="#B4BBD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg></button>
<button style="height: 48px; padding: 0 12px; border-radius: 14px; border: 0; background: transparent; color: #EEF1FA; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 20px; height: 20px"><path d="M9.2 16a4.6 4.6 0 0 1 5.6 0M12 19.5h.01M5.8 12.5a9.5 9.5 0 0 1 12.4 0"></path><path d="M2.5 9a14 14 0 0 1 19 0" stroke-opacity="0.3"></path></svg>
<span style="flex: 1; font-weight: 600; font-size: 14px">Fishbowl Guest</span><span style="font-size: 12px; color: #9AA3BD">Open</span></button>
<button style="height: 48px; padding: 0 12px; border-radius: 14px; border: 0; background: transparent; color: #EEF1FA; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 20px; height: 20px"><path d="M12 19.5h.01M9.2 16a4.6 4.6 0 0 1 5.6 0"></path><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0" stroke-opacity="0.3"></path></svg>
<span style="flex: 1; font-weight: 600; font-size: 14px">Coffee Corner</span><svg viewBox="0 0 24 24" fill="none" stroke="#B4BBD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg></button>
<div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 4px"></div>
<a href="SettingsNetwork.dc.html" style="height: 40px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Network settings…</a>
</section>

<div style="position: absolute; inset: 40px 0 0 0; background: rgba(5,8,20,0.45)"></div>

<div role="dialog" aria-labelledby="join-title" style="position: absolute; left: 500px; top: 270px; width: 440px; box-sizing: border-box; padding: 28px; border-radius: 28px; background: #151B2E; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 40px 120px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(160deg, #3CC8E8, #1290C2); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" style="width: 26px; height: 26px"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0M9.2 16a4.6 4.6 0 0 1 5.6 0M12 19.5h.01"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px"><h2 id="join-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Join “NETGEAR-22”</h2><span style="font-size: 14px; color: #B4BBD2">This network needs a password.</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="join-pw" style="font-size: 13px; font-weight: 600; color: #D5DAEA">Password</label>
<div style="height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-radius: 14px; background: #0F1426; border: 1.5px solid #8C9BFF; box-shadow: 0 0 0 4px rgba(140,155,255,0.18)">
<input id="join-pw" type="text" value="purple-otter-77" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #EEF1FA; font: inherit; font-size: 15px; font-family: 'JetBrains Mono', monospace; outline: none">
<button aria-label="Hide password" style="width: 38px; height: 38px; border: 0; border-radius: 10px; background: #222A48; color: #EEF1FA; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5"></path></svg></button>
</div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D5DAEA"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #FF7A59">Remember this network</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D5DAEA"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #FF7A59">Connect automatically</label>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px">
<button style="height: 48px; border-radius: 14px; border: 0; background: #222A48; color: #EEF1FA; font: inherit; font-weight: 600">Cancel</button>
<button style="height: 48px; border-radius: 14px; border: 0; background: #FF7A59; color: #2A120A; font: inherit; font-weight: 700">Join</button>
</div>
</div>

<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="dark" active="none" running="terminal" hint-size="760px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
