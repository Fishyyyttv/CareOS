<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS settings network</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0} input::placeholder{color:#9AA3BD}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B1020; color: #EEF1FA; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -200px; top: 220px; border-radius: 50%; background: #2C3FA8; opacity: 0.55; filter: blur(90px)"></div>
<div style="position: absolute; width: 620px; height: 620px; right: -120px; top: -180px; border-radius: 50%; background: #FF7A59; opacity: 0.30; filter: blur(100px)"></div>
<div style="position: absolute; width: 1200px; height: 1200px; left: 420px; top: 120px; border-radius: 50%; border: 90px solid rgba(140,155,255,0.06)"></div>

<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="dark" app="Settings" hint-size="1440px,40px"></dc-import>
</div>

<div style="position: absolute; left: 100px; top: 64px; width: 1240px; height: 716px; border-radius: 22px; background: #121729; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 40px 100px rgba(0,0,0,0.55); overflow: hidden; display: grid; grid-template-columns: 280px 1fr">

<nav aria-label="Settings sections" style="background: #0F1323; border-right: 1px solid rgba(255,255,255,0.06); padding: 16px 14px; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; gap: 8px; padding: 2px 4px 14px">
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FF5F57"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #F5B83D"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #3DD68C"></span>
</div>
<label for="st-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search settings</label>
<input id="st-search" placeholder="Search settings" style="height: 40px; padding: 0 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #1A2038; color: #EEF1FA; font: inherit; font-size: 14px">
<button style="height: 56px; padding: 0 10px; border-radius: 14px; border: 0; background: #1C2440; color: #EEF1FA; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left; margin-bottom: 8px">
<span style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(150deg, #FF9A76, #7B61FF); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #FFFFFF">F</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 14px">fishfish</span><span style="font-size: 12px; color: #9AA3BD">Administrator</span></span></button>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="11">
<button style="height: 40px; padding: 0 10px; border-radius: 12px; border: 0; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 14px; font-weight: {{s.weight}}; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 26px; height: 26px; border-radius: 8px; background: {{s.tile}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px"><path d="{{s.d}}"></path></svg></span>{{s.label}}</button>
</sc-for>
</nav>

<main style="padding: 28px 36px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Wi-Fi &amp; Network</h1>
<div style="display: flex; gap: 8px">
<button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #1C2440; color: #EEF1FA; font: inherit; font-size: 14px; font-weight: 600">Run diagnostics</button>
<button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #1C2440; color: #EEF1FA; font: inherit; font-size: 14px; font-weight: 600">Renew DHCP</button>
</div>
</div>

<div style="padding: 20px; border-radius: 20px; background: linear-gradient(135deg, rgba(255,122,89,0.18), rgba(140,155,255,0.14)); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; gap: 18px">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #FF7A59; color: #2A120A; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 28px; height: 28px"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0M9.2 16a4.6 4.6 0 0 1 5.6 0M12 19.5h.01"></path></svg></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Fishbowl 5G</span>
<span style="font-size: 14px; color: #D5DAEA; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3DD68C"></span>Connected · Internet OK · WPA3</span>
</div>
<span style="width: 52px; height: 32px; border-radius: 16px; background: #FF7A59; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box" role="switch" aria-checked="true" aria-label="Wi-Fi"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF"></span></span>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<div style="padding: 14px 16px; border-radius: 16px; background: #1A2038; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #9AA3BD; font-weight: 600">IP address</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">192.168.1.42</span></div>
<div style="padding: 14px 16px; border-radius: 16px; background: #1A2038; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #9AA3BD; font-weight: 600">Router</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">192.168.1.1</span></div>
<div style="padding: 14px 16px; border-radius: 16px; background: #1A2038; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #9AA3BD; font-weight: 600">DNS</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">Automatic</span></div>
<div style="padding: 14px 16px; border-radius: 16px; background: #1A2038; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #9AA3BD; font-weight: 600">Link speed</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">433 Mbps</span></div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
<section style="border-radius: 18px; background: #1A2038; padding: 6px; display: flex; flex-direction: column">
<h2 style="margin: 0; padding: 12px 14px 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA3BD">Known networks</h2>
<div style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px"><span style="flex: 1; font-weight: 600">Fishbowl 5G</span><span style="font-size: 12px; font-weight: 700; color: #3DD68C">Auto-join</span></div>
<div style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; border-top: 1px solid rgba(255,255,255,0.06)"><span style="flex: 1; font-weight: 600">Fishbowl Guest</span><span style="font-size: 12px; color: #9AA3BD">Ask first</span></div>
<div style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; border-top: 1px solid rgba(255,255,255,0.06)"><span style="flex: 1; font-weight: 600">Library-Public</span><button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 0; background: #2A3358; color: #EEF1FA; font: inherit; font-size: 13px; font-weight: 600">Forget</button></div>
</section>
<section style="border-radius: 18px; background: #1A2038; padding: 6px; display: flex; flex-direction: column">
<h2 style="margin: 0; padding: 12px 14px 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA3BD">More connections</h2>
<button style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; border: 0; background: transparent; color: #EEF1FA; font: inherit; text-align: left"><span style="flex: 1; font-weight: 600">Ethernet</span><span style="font-size: 13px; color: #9AA3BD">Cable unplugged</span><svg viewBox="0 0 24 24" fill="none" stroke="#9AA3BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px"><path d="M9 6l6 6-6 6"></path></svg></button>
<button style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #EEF1FA; font: inherit; text-align: left"><span style="flex: 1; font-weight: 600">VPN</span><span style="font-size: 13px; color: #9AA3BD">Off</span><svg viewBox="0 0 24 24" fill="none" stroke="#9AA3BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px"><path d="M9 6l6 6-6 6"></path></svg></button>
<button style="height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 12px; border: 0; border-top: 1px solid rgba(255,255,255,0.06); background: transparent; color: #EEF1FA; font: inherit; text-align: left"><span style="flex: 1; font-weight: 600">Proxy</span><span style="font-size: 13px; color: #9AA3BD">None</span><svg viewBox="0 0 24 24" fill="none" stroke="#9AA3BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px"><path d="M9 6l6 6-6 6"></path></svg></button>
</section>
</div>

<div style="padding: 14px 16px; border-radius: 16px; background: rgba(140,155,255,0.10); border: 1px solid rgba(140,155,255,0.25); display: flex; align-items: center; gap: 12px; font-size: 14px; color: #D5DAEA">
<svg viewBox="0 0 24 24" fill="none" stroke="#8C9BFF" stroke-width="2" stroke-linecap="round" style="width: 20px; height: 20px; flex-shrink: 0"><path d="M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17M12 11v5.5M12 7.8h.01"></path></svg>
<span style="flex: 1">Prefer the terminal? <code style="font-family: 'JetBrains Mono', monospace; color: #EEF1FA; background: #0F1426; padding: 2px 6px; border-radius: 6px">network --status</code> shows the same info.</span>
</div>
</main>
</div>

<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="dark" active="settings" running="terminal" hint-size="760px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var S = [
      ['Wi-Fi & Network', '#1290C2', 'M2.5 9a14 14 0 0 1 19 0M5.8 12.5a9.5 9.5 0 0 1 12.4 0M9.2 16a4.6 4.6 0 0 1 5.6 0M12 19.5h.01'],
      ['Bluetooth', '#4F5EF2', 'M7 7l10 10-5 5V2l5 5L7 17'],
      ['Display', '#F2782E', 'M4 5h16v11H4zM9 20h6M12 16v4'],
      ['Appearance', '#E5532E', 'M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2s-1-2 0-3 2-1 3-1h1a3 3 0 0 0 3-3c0-5-4-9-9-9z'],
      ['Sound', '#E2508F', 'M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9a4.5 4.5 0 0 1 0 6'],
      ['Notifications', '#EB4950', 'M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0'],
      ['Focus', '#7F6CC2', 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z'],
      ['Accounts', '#2F86EB', 'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8M4.5 20.5c.8-3.8 3.8-6 7.5-6s6.7 2.2 7.5 6'],
      ['Privacy', '#5D6987', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'],
      ['Storage', '#1FA562', 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'],
      ['Updates', '#0E9E8F', 'M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6'],
      ['About CareOS', '#8E4DF0', 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17M12 11v5.5M12 7.8h.01']
    ];
    var active = 0;
    return {
      sections: S.map(function (s, i) {
        var on = i === active;
        return { label: s[0], tile: s[1], d: s[2], bg: on ? '#26305A' : 'transparent', fg: on ? '#FFFFFF' : '#D5DAEA', weight: on ? 700 : 500 };
      })
    };
  }
}
</script>
</body>
</html>
