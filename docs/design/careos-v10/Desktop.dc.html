<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0} input::placeholder{color:#9AA3BD}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B1020; color: #EEF1FA; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -200px; top: 220px; border-radius: 50%; background: #2C3FA8; opacity: 0.55; filter: blur(90px)"></div>
<div style="position: absolute; width: 620px; height: 620px; right: -120px; top: -180px; border-radius: 50%; background: #FF7A59; opacity: 0.30; filter: blur(100px)"></div>
<div style="position: absolute; width: 520px; height: 520px; right: 240px; bottom: -280px; border-radius: 50%; background: #7B61FF; opacity: 0.35; filter: blur(90px)"></div>
<div style="position: absolute; width: 1200px; height: 1200px; left: 420px; top: 120px; border-radius: 50%; border: 90px solid rgba(140,155,255,0.06)"></div>

<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="dark" app="Desktop" hint-size="1440px,40px"></dc-import>
</div>

<div style="position: absolute; left: 28px; top: 68px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{shortcuts}}" as="item" hint-placeholder-count="4">
<button style="width: 96px; padding: 8px 4px; border: 0; border-radius: 16px; background: transparent; color: #EEF1FA; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 8px">
<dc-import name="AppIcon" app="{{item.app}}" size="56" hint-size="56px,56px"></dc-import>
<span style="font-size: 13px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.6)">{{item.label}}</span>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 260px; top: 200px; width: 700px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 500; color: #D5DAEA">Saturday, October 3</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.03em">Good morning, fishfish.</h1>
</div>
<label for="desk-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
<div style="height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 20px; border-radius: 20px; background: rgba(21,27,46,0.72); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(24px); box-shadow: 0 20px 50px rgba(0,0,0,0.3)">
<svg viewBox="0 0 24 24" fill="none" stroke="#B4BBD2" stroke-width="2" stroke-linecap="round" style="width: 20px; height: 20px"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg>
<input id="desk-search" placeholder="Search apps, files, settings and the web" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: #EEF1FA; font: inherit; font-size: 17px; outline: none">
<span style="display: flex; gap: 4px"><kbd style="padding: 4px 8px; border-radius: 8px; background: #222A48; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D5DAEA">Ctrl</kbd><kbd style="padding: 4px 8px; border-radius: 8px; background: #222A48; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D5DAEA">Space</kbd></span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button style="height: 40px; padding: 0 16px 0 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(21,27,46,0.6); color: #EEF1FA; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><dc-import name="AppIcon" app="terminal" size="24" hint-size="24px,24px"></dc-import>Resume in Terminal</button>
<button style="height: 40px; padding: 0 16px 0 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(21,27,46,0.6); color: #EEF1FA; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><dc-import name="AppIcon" app="editor" size="24" hint-size="24px,24px"></dc-import>preview.cl</button>
<button style="height: 40px; padding: 0 16px 0 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(21,27,46,0.6); color: #EEF1FA; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><dc-import name="AppIcon" app="store" size="24" hint-size="24px,24px"></dc-import>3 updates ready</button>
</div>
</div>

<div style="position: absolute; right: 24px; top: 64px; width: 300px; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 20px; border-radius: 24px; background: rgba(21,27,46,0.66); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(24px); display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #FF9A76">Saturday</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 52px; letter-spacing: -0.03em; line-height: 1">9:41</span>
<span style="font-size: 14px; color: #B4BBD2">October 3, 2026</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<svg viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2" stroke-linecap="round" style="width: 34px; height: 34px"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">68°</span>
<span style="font-size: 12px; color: #B4BBD2">Sunny</span>
</div>
</div>

<div style="padding: 18px 18px 14px; border-radius: 24px; background: rgba(21,27,46,0.66); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(24px); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">October</span>
<span style="font-size: 12px; color: #9AA3BD">2026</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; font-size: 12px">
<sc-for list="{{dow}}" as="d" hint-placeholder-count="7"><span style="color: #9AA3BD; font-weight: 700; padding-bottom: 4px">{{d}}</span></sc-for>
<sc-for list="{{days}}" as="day" hint-placeholder-count="35">
<span style="height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 30px; justify-self: center; background: {{day.bg}}; color: {{day.fg}}; font-weight: {{day.weight}}">{{day.n}}</span>
</sc-for>
</div>
</div>

<div style="padding: 18px; border-radius: 24px; background: rgba(21,27,46,0.66); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(24px); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">System</span>
<span style="font-size: 12px; color: #3DD68C; font-weight: 700">All good</span>
</div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #B4BBD2">CPU</span><span style="font-weight: 700">12%</span></div><div style="height: 6px; border-radius: 3px; background: #2E3757"><div style="width: 12%; height: 100%; border-radius: 3px; background: #8C9BFF"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #B4BBD2">Memory</span><span style="font-weight: 700">38%</span></div><div style="height: 6px; border-radius: 3px; background: #2E3757"><div style="width: 38%; height: 100%; border-radius: 3px; background: #FF7A59"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #B4BBD2">Disk</span><span style="font-weight: 700">54%</span></div><div style="height: 6px; border-radius: 3px; background: #2E3757"><div style="width: 54%; height: 100%; border-radius: 3px; background: #3DD68C"></div></div></div>
</div>
</div>

<div style="position: absolute; left: 260px; top: 560px; width: 240px; padding: 18px; border-radius: 20px; background: #FFD36B; color: #3A2600; box-shadow: 0 20px 40px rgba(0,0,0,0.3); transform: rotate(-2deg); display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px">Today</span>
<span style="font-size: 14px; line-height: 1.5">Fix wifi driver timeout<br>Try the new Care script<br>Back up home folder</span>
</div>

<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="dark" active="none" running="terminal" hint-size="760px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var days = [];
    for (var i = 0; i < 4; i++) days.push({ n: '', bg: 'transparent', fg: '#EEF1FA', weight: 500 });
    for (var d = 1; d <= 31; d++) {
      var today = d === 3;
      days.push({ n: String(d), bg: today ? '#FF7A59' : 'transparent', fg: today ? '#2A120A' : '#EEF1FA', weight: today ? 800 : 500 });
    }
    return {
      dow: ['S', 'M', 'T', 'W', 'T', 'F', 'S'],
      days: days,
      shortcuts: [
        { app: 'files', label: 'Home' },
        { app: 'care', label: 'Care scripts' },
        { app: 'photos', label: 'Wallpapers' },
        { app: 'trash', label: 'Trash' }
      ]
    };
  }
}
</script>
</body>
</html>
