<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS power menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}
@keyframes pip-bounce{0%,100%{transform:none}15%{transform:scale(1.08,.92)}40%{transform:translateY(-20px) scale(.94,1.06)}65%{transform:scale(1.06,.94)}82%{transform:translateY(-2px) scale(.99,1.01)}}
@keyframes pip-sh-bounce{0%,100%{transform:none}15%{transform:scale(1.08)}40%{transform:scale(.7);opacity:.5}65%{transform:scale(1.06)}}
@keyframes pip-wave{0%,100%{transform:none}50%{transform:rotate(-38deg)}}
@keyframes pip-halo{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.7);opacity:0}}
@keyframes pip-float{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-28px);opacity:0}}
@keyframes pip-pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B1020; color: #EEF1FA; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -200px; top: 220px; border-radius: 50%; background: #2C3FA8; opacity: 0.55; filter: blur(90px)"></div>
<div style="position: absolute; width: 620px; height: 620px; right: -120px; top: -180px; border-radius: 50%; background: #FF7A59; opacity: 0.30; filter: blur(100px)"></div>
<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="dark" app="Desktop" hint-size="1440px,40px"></dc-import>
</div>
<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="dark" active="none" running="terminal" hint-size="760px,96px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(5,8,20,0.62); backdrop-filter: blur(14px)"></div>

<div role="dialog" aria-labelledby="pw-title" style="position: absolute; left: 400px; top: 170px; width: 640px; box-sizing: border-box; padding: 32px; border-radius: 32px; background: #151B2E; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 40px 120px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 22px">
<div style="margin-top: -96px">
<dc-import name="Pet" mood="happy" color="lilac" hat="beanie" outfit="scarf" size="140" hint-size="140px,140px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<h2 id="pw-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Taking a break?</h2>
<p style="margin: 0; font-size: 15px; color: #B4BBD2">Pip says see you soon. Your open windows are saved.</p>
</div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<button style="height: 116px; border-radius: 22px; border: 0; background: #1C2440; color: #EEF1FA; font: inherit; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #2A3358; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="#B7C1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></span>Sleep</button>
<button style="height: 116px; border-radius: 22px; border: 0; background: #1C2440; color: #EEF1FA; font: inherit; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #2A3358; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="#7CF0B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg></span>Restart</button>
<button style="height: 116px; border-radius: 22px; border: 0; background: #FF7A59; color: #2A120A; font: inherit; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(42,18,10,0.14); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 24px; height: 24px"><path d="M12 3v8M6.5 6.5a8 8 0 1 0 11 0"></path></svg></span>Shut down</button>
<a href="Login.dc.html" style="height: 116px; border-radius: 22px; background: #1C2440; color: #EEF1FA; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none"><span style="width: 52px; height: 52px; border-radius: 50%; background: #2A3358; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"></path></svg></span>Log out</a>
</div>
<label style="align-self: flex-start; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #D5DAEA"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #FF7A59">Reopen my windows when I come back</label>
<div style="width: 100%; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; color: #9AA3BD">Shutting down in 60 s if you don’t pick</span>
<button style="height: 46px; padding: 0 22px; border-radius: 14px; border: 0; background: #222A48; color: #EEF1FA; font: inherit; font-weight: 700">Cancel</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
