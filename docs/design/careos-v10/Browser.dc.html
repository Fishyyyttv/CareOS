<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0} input::placeholder{color:#9AA3BD} a{color:#B7C1FF}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B1020; color: #EEF1FA; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -200px; top: 220px; border-radius: 50%; background: #2C3FA8; opacity: 0.55; filter: blur(90px)"></div>
<div style="position: absolute; width: 620px; height: 620px; right: -120px; top: -180px; border-radius: 50%; background: #FF7A59; opacity: 0.30; filter: blur(100px)"></div>

<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="dark" app="Browser" hint-size="1440px,40px"></dc-import>
</div>

<div style="position: absolute; left: 60px; top: 60px; width: 1320px; height: 724px; border-radius: 22px; background: #121729; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 40px 100px rgba(0,0,0,0.55); overflow: hidden; display: flex; flex-direction: column">

<div style="height: 48px; padding: 0 12px; display: flex; align-items: flex-end; gap: 6px; background: #0C1020">
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding-right: 10px">
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FF5F57"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #F5B83D"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #3DD68C"></span>
</div>
<div style="height: 38px; width: 220px; padding: 0 10px 0 14px; border-radius: 12px 12px 0 0; background: #121729; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
<svg viewBox="0 0 24 24" style="width: 16px; height: 16px" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#FF7A59"></circle><path d="M12 17.5s-4.6-2.9-4.6-6.6a2.6 2.6 0 0 1 4.6-1.7a2.6 2.6 0 0 1 4.6 1.7c0 3.7-4.6 6.6-4.6 6.6z" fill="#2A120A"></path></svg>
<span style="flex: 1">New Tab</span>
<button aria-label="Close tab" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #9AA3BD; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 12px; height: 12px"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="height: 38px; width: 220px; padding: 0 10px 0 14px; border-radius: 12px 12px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #B4BBD2">
<span style="width: 16px; height: 16px; border-radius: 4px; background: #8E4DF0"></span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Care Language · Docs</span>
</div>
<div style="height: 38px; width: 220px; padding: 0 10px 0 14px; border-radius: 12px 12px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #B4BBD2">
<span style="width: 16px; height: 16px; border-radius: 4px; background: #1FA562"></span><span style="flex: 1">localhost:8080</span>
</div>
<button aria-label="New tab" style="width: 32px; height: 32px; margin-bottom: 3px; border: 0; border-radius: 10px; background: transparent; color: #B4BBD2; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>

<div style="height: 56px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.06)">
<button aria-label="Back" style="width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #EEF1FA; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-label="Forward" style="width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #6A7393; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M9 6l6 6-6 6"></path></svg></button>
<button aria-label="Reload" style="width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #EEF1FA; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg></button>
<label for="br-url" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Address</label>
<div style="flex: 1; height: 40px; padding: 0 14px; border-radius: 14px; background: #1A2038; display: flex; align-items: center; gap: 10px">
<svg viewBox="0 0 24 24" fill="none" stroke="#9AA3BD" stroke-width="2" stroke-linecap="round" style="width: 16px; height: 16px"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg>
<input id="br-url" placeholder="Search or type an address" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #EEF1FA; font: inherit; font-size: 15px; outline: none">
<button aria-label="Bookmark" style="width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: #9AA3BD; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px"><path d="M6 4h12v17l-6-4-6 4z"></path></svg></button>
</div>
<button aria-label="Downloads" style="width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #EEF1FA; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
<button aria-label="Menu" style="width: 38px; height: 38px; border: 0; border-radius: 12px; background: transparent; color: #EEF1FA; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="width: 18px; height: 18px"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
</div>

<div style="flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 70px; gap: 30px">
<div style="position: absolute; width: 700px; height: 700px; left: 310px; top: -360px; border-radius: 50%; background: #FF7A59; opacity: 0.12; filter: blur(90px)"></div>
<div style="position: relative; display: flex; align-items: center; gap: 14px">
<dc-import name="AppIcon" app="browser" size="56" hint-size="56px,56px"></dc-import>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; letter-spacing: -0.03em">Where to?</span>
</div>
<label for="br-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search the web</label>
<div style="position: relative; width: 640px; height: 58px; padding: 0 8px 0 20px; border-radius: 20px; background: #1A2038; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.3)">
<svg viewBox="0 0 24 24" fill="none" stroke="#B4BBD2" stroke-width="2" stroke-linecap="round" style="width: 20px; height: 20px"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14M20 20l-4-4"></path></svg>
<input id="br-search" placeholder="Search the web" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #EEF1FA; font: inherit; font-size: 17px; outline: none">
<button style="height: 42px; padding: 0 18px; border-radius: 14px; border: 0; background: #FF7A59; color: #2A120A; font: inherit; font-weight: 700">Search</button>
</div>

<div style="position: relative; display: grid; grid-template-columns: repeat(6, 108px); gap: 14px">
<sc-for list="{{sites}}" as="s" hint-placeholder-count="6">
<a href="#" style="height: 108px; border-radius: 20px; background: #1A2038; border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #EEF1FA">
<span style="width: 44px; height: 44px; border-radius: 14px; background: {{s.color}}; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; color: #FFFFFF">{{s.letter}}</span>
<span style="font-size: 13px; font-weight: 600">{{s.label}}</span>
</a>
</sc-for>
</div>

<div style="position: relative; width: 720px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
<div style="padding: 18px; border-radius: 20px; background: #1A2038; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA3BD">Pick up where you left off</span>
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #EEF1FA; font-weight: 600; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8E4DF0"></span>Care Language · Control flow</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #EEF1FA; font-weight: 600; font-size: 14px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1290C2"></span>Writing a Wi-Fi driver, part 2</a>
</div>
<div style="padding: 18px; border-radius: 20px; background: #1A2038; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA3BD">Privacy</span>
<span style="font-size: 14px; line-height: 1.5; color: #D5DAEA">Trackers blocked automatically. Your history stays on this computer.</span>
</div>
</div>
</div>
</div>

<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="dark" active="browser" running="terminal" hint-size="760px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sites: [
        { label: 'Care Docs', letter: 'C', color: '#E5532E' },
        { label: 'Packages', letter: 'P', color: '#8E4DF0' },
        { label: 'Forum', letter: 'F', color: '#2F86EB' },
        { label: 'Wiki', letter: 'W', color: '#1FA562' },
        { label: 'Mail', letter: 'M', color: '#E2508F' },
        { label: 'Add site', letter: '+', color: '#3A4262' }
      ]
    };
  }
}
</script>
</body>
</html>
