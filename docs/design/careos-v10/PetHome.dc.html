<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip's home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}
@keyframes pip-bob{0%,100%{transform:none}50%{transform:translateY(-5px) scale(1.01,.99)}}
@keyframes pip-bounce{0%,100%{transform:none}15%{transform:scale(1.08,.92)}40%{transform:translateY(-20px) scale(.94,1.06)}65%{transform:scale(1.06,.94)}82%{transform:translateY(-2px) scale(.99,1.01)}}
@keyframes pip-droop{0%,100%{transform:none}50%{transform:translateY(5px) scale(1.04,.96) rotate(-2deg)}}
@keyframes pip-tilt{0%,100%{transform:none}30%{transform:rotate(-6deg)}70%{transform:rotate(6deg) translateY(-2px)}}
@keyframes pip-wobble{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes pip-hop{0%,100%{transform:none}25%{transform:translateY(-10px) rotate(-4deg)}50%{transform:translateY(-14px)}75%{transform:translateY(-6px) rotate(4deg)}}
@keyframes pip-breathe{0%,100%{transform:none}50%{transform:scale(1.04,.96)}}
@keyframes pip-jump{0%,100%{transform:none}12%{transform:scale(1.12,.86)}42%{transform:translateY(-32px) scale(.92,1.08)}70%{transform:scale(1.08,.92)}85%{transform:scale(.98,1.02)}}
@keyframes pip-sh-bob{0%,100%{transform:none}50%{transform:scale(.94)}}
@keyframes pip-sh-bounce{0%,100%{transform:none}15%{transform:scale(1.08)}40%{transform:scale(.7);opacity:.5}65%{transform:scale(1.06)}}
@keyframes pip-sh-hop{0%,100%{transform:none}50%{transform:scale(.78);opacity:.6}}
@keyframes pip-sh-jump{0%,100%{transform:none}12%{transform:scale(1.1)}42%{transform:scale(.55);opacity:.4}70%{transform:scale(1.08)}}
@keyframes pip-blink{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}
@keyframes pip-wave{0%,100%{transform:none}50%{transform:rotate(-38deg)}}
@keyframes pip-feet{0%,100%{transform:none}50%{transform:translateY(-6px)}}
@keyframes pip-look{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pip-halo{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.7);opacity:0}}
@keyframes pip-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pip-float{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-28px);opacity:0}}
@keyframes pip-twinkle{0%,100%{transform:scale(.4);opacity:.25}50%{transform:scale(1);opacity:1}}
@keyframes pip-aura{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.08);opacity:.95}}
@keyframes pip-tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes home-star{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0B1020; color: #EEF1FA; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -200px; top: 220px; border-radius: 50%; background: #2C3FA8; opacity: 0.55; filter: blur(90px)"></div>
<div style="position: absolute; width: 620px; height: 620px; right: -120px; top: -180px; border-radius: 50%; background: #FF7A59; opacity: 0.30; filter: blur(100px)"></div>

<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="dark" app="Pip’s Home" hint-size="1440px,40px"></dc-import>
</div>

<div style="position: absolute; left: 60px; top: 58px; width: 1320px; height: 728px; border-radius: 24px; background: #121729; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 40px 100px rgba(0,0,0,0.55); overflow: hidden; display: grid; grid-template-columns: 1fr 440px">

<section aria-label="Pip's room" style="position: relative; overflow: hidden; background: #2A2257">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 470px; background: #3A2F78"></div>
<div style="position: absolute; left: 0; right: 0; top: 0; height: 470px; opacity: 0.25; background-image: radial-gradient(#FFFFFF 1.2px, transparent 1.4px); background-size: 34px 34px"></div>
<div style="position: absolute; left: 0; right: 0; top: 470px; bottom: 0; background: #C98B5E"></div>
<div style="position: absolute; left: 0; right: 0; top: 470px; height: 14px; background: #A86E46"></div>
<div style="position: absolute; left: 0; right: 0; top: 520px; height: 2px; background: rgba(0,0,0,0.12)"></div>
<div style="position: absolute; left: 0; right: 0; top: 590px; height: 2px; background: rgba(0,0,0,0.12)"></div>

<div style="position: absolute; left: 72px; top: 110px; width: 200px; height: 170px; border-radius: 100px 100px 16px 16px; background: #0E1338; border: 10px solid #F3E7D3; box-sizing: border-box; overflow: hidden">
<div style="position: absolute; right: 26px; top: 24px; width: 40px; height: 40px; border-radius: 50%; background: #FFE9A8; box-shadow: 0 0 24px #FFE08A"></div>
<div style="position: absolute; left: 30px; top: 40px; width: 4px; height: 4px; border-radius: 50%; background: #FFFFFF; animation: home-star 2s ease-in-out infinite"></div>
<div style="position: absolute; left: 70px; top: 90px; width: 3px; height: 3px; border-radius: 50%; background: #FFFFFF; animation: home-star 2.6s ease-in-out 0.5s infinite"></div>
<div style="position: absolute; left: 110px; top: 60px; width: 4px; height: 4px; border-radius: 50%; background: #FFFFFF; animation: home-star 1.8s ease-in-out 1s infinite"></div>
<div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: #F3E7D3"></div>
</div>

<div style="position: absolute; right: 70px; top: 120px; width: 150px; height: 110px; border-radius: 12px; background: #F3E7D3; border: 8px solid #8A5A3A; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<dc-import name="Pet" mood="happy" color="{{color}}" size="70" still="true" hint-size="70px,70px"></dc-import>
</div>
<div style="position: absolute; right: 70px; top: 238px; width: 150px; text-align: center; font-size: 12px; font-weight: 700; color: #D9D1FF">{{name}}, age 3 days</div>

<div style="position: absolute; left: 50%; top: 520px; width: 480px; height: 110px; margin-left: -240px; border-radius: 50%; background: #FF8EC4; opacity: 0.85"></div>
<div style="position: absolute; left: 50%; top: 534px; width: 400px; height: 82px; margin-left: -200px; border-radius: 50%; border: 4px dashed rgba(255,255,255,0.45); box-sizing: border-box"></div>

<div style="position: absolute; left: 70px; top: 474px; width: 170px; height: 70px; border-radius: 40px 40px 28px 28px; background: #8C9BFF"></div>
<div style="position: absolute; left: 86px; top: 482px; width: 138px; height: 40px; border-radius: 30px; background: #B7C1FF"></div>
<div style="position: absolute; right: 130px; top: 500px; width: 54px; height: 54px; border-radius: 50%; background: #FFC24B; box-shadow: inset -8px -8px 0 rgba(0,0,0,0.12)"><div style="position: absolute; left: 0; right: 0; top: 23px; height: 8px; background: #FF5A5F"></div></div>
<div style="position: absolute; right: 60px; top: 400px; width: 56px; height: 76px; border-radius: 6px 6px 14px 14px; background: #E5603F"></div>
<div style="position: absolute; right: 52px; top: 330px; width: 72px; height: 80px; border-radius: 50% 50% 40% 40%; background: #2FAE7D"></div>

<div style="position: absolute; left: 50%; top: 270px; margin-left: -140px; width: 280px; height: 280px">
<dc-import name="Pet" mood="{{mood}}" color="{{color}}" hat="{{hat}}" outfit="{{outfit}}" acc="{{acc}}" effect="{{effect}}" size="280" hint-size="280px,280px"></dc-import>
</div>

<div style="position: absolute; left: 24px; top: 20px; right: 24px; display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pet-name" style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #D9D1FF">Name</label>
<input id="pet-name" value="{{name}}" onChange="{{onName}}" maxlength="14" style="width: 200px; height: 46px; padding: 0 14px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.25); background: rgba(14,19,56,0.55); color: #FFFFFF; font: inherit; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; box-sizing: border-box">
</div>
<div style="width: 220px; padding: 12px 14px; border-radius: 16px; background: rgba(14,19,56,0.55); display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 700">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between"><span>Happiness</span><span>{{happy}}%</span></span><div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15)"><div style="width: {{happyW}}; height: 100%; border-radius: 3px; background: #FF8EC4"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between"><span>Energy</span><span>{{energy}}%</span></span><div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15)"><div style="width: {{energyW}}; height: 100%; border-radius: 3px; background: #FFC24B"></div></div></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="display: flex; justify-content: space-between"><span>Friendship</span><span>Lv 4</span></span><div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15)"><div style="width: 62%; height: 100%; border-radius: 3px; background: #3DD68C"></div></div></div>
</div>
</div>

<div style="position: absolute; left: 24px; right: 24px; bottom: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="9">
<button onClick="{{m.pick}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}}"></span>{{m.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 10px; justify-content: center">
<button onClick="{{onPat}}" style="height: 50px; padding: 0 20px; border-radius: 16px; border: 0; background: rgba(14,19,56,0.7); color: #FFFFFF; font: inherit; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg viewBox="0 0 24 24" fill="#FF8EC4" style="width: 18px; height: 18px"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Pat</button>
<button onClick="{{onTuck}}" style="height: 50px; padding: 0 20px; border-radius: 16px; border: 0; background: rgba(14,19,56,0.7); color: #FFFFFF; font: inherit; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg viewBox="0 0 24 24" fill="none" stroke="#B7C1FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>Tuck in</button>
<button onClick="{{onRandom}}" style="height: 50px; padding: 0 20px; border-radius: 16px; border: 0; background: rgba(14,19,56,0.7); color: #FFFFFF; font: inherit; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg viewBox="0 0 24 24" fill="none" stroke="#FFC24B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M4 7h3l10 10h3M17 4l3 3-3 3M4 17h3l3-3M14 10l3-3h3M17 14l3 3-3 3"></path></svg>Surprise me</button>
<a href="PetDesktop.dc.html" style="height: 50px; padding: 0 24px; border-radius: 16px; background: #FF7A59; color: #2A120A; font-weight: 800; display: flex; align-items: center; gap: 8px; text-decoration: none">Let {{name}} out<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</section>

<aside style="padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid rgba(255,255,255,0.08)">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">Dress up {{name}}</span>
<span style="font-size: 13px; color: #B4BBD2">Changes show up right away, everywhere.</span>
</div>
<div style="display: flex; gap: 8px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #F5B83D"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #3DD68C"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #FF5F57"></span></div>
</div>

<div role="tablist" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #0C1020">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 38px; border-radius: 10px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 100px; gap: 8px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="9">
<button aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="border-radius: 16px; border: {{o.border}}; background: {{o.bg}}; color: #EEF1FA; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; cursor: pointer; box-sizing: border-box">
<dc-import name="Pet" mood="idle" color="{{o.color}}" hat="{{o.hat}}" outfit="{{o.outfit}}" acc="{{o.acc}}" effect="{{o.effect}}" size="64" still="true" hint-size="64px,64px"></dc-import>
<span style="font-size: 12px; font-weight: 700">{{o.label}}</span>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px 4px 0; border-top: 1px solid rgba(255,255,255,0.08)">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #9AA3BD; padding: 10px 0 4px">When {{name}} is out</span>
<sc-for list="{{toggles}}" as="g" hint-placeholder-count="3">
<div style="height: 40px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600">
<span>{{g.label}}</span>
<button role="switch" aria-checked="{{g.on}}" aria-label="{{g.label}}" onClick="{{g.flip}}" style="width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 3px; background: {{g.track}}; display: flex; justify-content: {{g.justify}}; cursor: pointer"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></button>
</div>
</sc-for>
</div>
</aside>
</div>

<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="dark" active="pet" running="terminal" hint-size="760px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'hat', color: 'lilac', hat: 'beanie', outfit: 'scarf', acc: 'none', effect: 'sparkles',
      mood: 'happy', name: 'Pip', roam: true, follow: true, nap: true
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var OPTS = {
      color: [['lilac', 'Lilac'], ['coral', 'Coral'], ['mint', 'Mint'], ['sky', 'Sky'], ['honey', 'Honey'], ['bubblegum', 'Bubblegum'], ['midnight', 'Midnight'], ['snow', 'Snow']],
      hat: [['none', 'None'], ['beanie', 'Beanie'], ['crown', 'Crown'], ['party', 'Party'], ['wizard', 'Wizard'], ['cap', 'Cap'], ['bow', 'Bow'], ['headphones', 'Phones'], ['sprout', 'Sprout']],
      outfit: [['none', 'None'], ['scarf', 'Scarf'], ['bowtie', 'Bow tie'], ['hoodie', 'Hoodie'], ['cape', 'Cape'], ['overalls', 'Overalls']],
      acc: [['none', 'None'], ['glasses', 'Glasses'], ['shades', 'Shades'], ['star', 'Star clip']],
      effect: [['none', 'None'], ['glow', 'Glow'], ['sparkles', 'Sparkles'], ['hearts', 'Hearts'], ['bubbles', 'Bubbles'], ['rainbow', 'Rainbow']]
    };
    var TABS = [['color', 'Color'], ['hat', 'Hats'], ['outfit', 'Outfits'], ['acc', 'Extras'], ['effect', 'Effects']];
    var MOODS = [
      ['idle', 'Chill', '#8C9BFF'], ['happy', 'Happy', '#FF8EC4'], ['sad', 'Sad', '#6CB8FF'],
      ['thinking', 'Thinking', '#FFC24B'], ['confused', 'Confused', '#C08BFF'], ['watching', 'Watching', '#3DD68C'],
      ['playing', 'Playing', '#FF7A59'], ['sleeping', 'Sleepy', '#5A6385'], ['excited', 'Excited', '#FFC24B']
    ];
    var options = OPTS[st.tab].map(function (o) {
      var on = st[st.tab] === o[0];
      var cfg = { color: st.color, hat: st.hat, outfit: st.outfit, acc: st.acc, effect: 'none' };
      cfg[st.tab] = o[0];
      if (st.tab !== 'effect') cfg.effect = 'none';
      return {
        label: o[1], on: on, color: cfg.color, hat: cfg.hat, outfit: cfg.outfit, acc: cfg.acc, effect: cfg.effect,
        bg: on ? 'rgba(255,122,89,0.16)' : '#1A2038',
        border: on ? '2px solid #FF7A59' : '2px solid transparent',
        pick: function () { var u = {}; u[st.tab] = o[0]; self.setState(u); }
      };
    });
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)][0]; };
    var happy = st.mood === 'sad' ? 34 : (st.mood === 'happy' || st.mood === 'excited' ? 96 : 78);
    var energy = st.mood === 'sleeping' ? 22 : (st.mood === 'playing' || st.mood === 'excited' ? 91 : 64);
    var togg = [['roam', 'Roam around my desktop'], ['follow', 'Watch my cursor'], ['nap', 'Nap when I’m away']];
    return {
      name: st.name,
      color: st.color, hat: st.hat, outfit: st.outfit, acc: st.acc, effect: st.effect, mood: st.mood,
      happy: happy, happyW: happy + '%', energy: energy, energyW: energy + '%',
      onName: function (e) { self.setState({ name: e.target.value }); },
      onPat: function () { self.setState({ mood: 'happy' }); },
      onTuck: function () { self.setState({ mood: 'sleeping' }); },
      onRandom: function () {
        self.setState({ color: pick(OPTS.color), hat: pick(OPTS.hat), outfit: pick(OPTS.outfit), acc: pick(OPTS.acc), effect: pick(OPTS.effect), mood: 'excited' });
      },
      tabs: TABS.map(function (t) {
        var on = st.tab === t[0];
        return { label: t[1], on: on, bg: on ? '#2A3358' : 'transparent', fg: on ? '#FFFFFF' : '#B4BBD2', pick: function () { self.setState({ tab: t[0] }); } };
      }),
      options: options,
      moods: MOODS.map(function (m) {
        var on = st.mood === m[0];
        return { label: m[1], dot: m[2], bg: on ? '#FFFFFF' : 'rgba(14,19,56,0.6)', fg: on ? '#1A1630' : '#EEF1FA', pick: function () { self.setState({ mood: m[0] }); } };
      }),
      toggles: togg.map(function (g) {
        var on = !!st[g[0]];
        return { label: g[1], on: on, track: on ? '#FF7A59' : '#2E3757', justify: on ? 'flex-end' : 'flex-start', flip: function () { var u = {}; u[g[0]] = !on; self.setState(u); } };
      })
    };
  }
}
</script>
</body>
</html>
