<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareOS packages store</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0} input::placeholder{color:#6A7189}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #E9ECF7; color: #161A2B; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; width: 900px; height: 900px; left: -240px; top: 260px; border-radius: 50%; background: #C9D2FF; filter: blur(90px)"></div>
<div style="position: absolute; width: 640px; height: 640px; right: -160px; top: -200px; border-radius: 50%; background: #FFD0C0; filter: blur(90px)"></div>

<div style="position: absolute; left: 0; top: 0">
<dc-import name="TopBar" theme="light" app="Packages" hint-size="1440px,40px"></dc-import>
</div>

<div style="position: absolute; left: 80px; top: 62px; width: 1280px; height: 720px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(22,26,43,0.08); box-shadow: 0 40px 100px rgba(40,50,110,0.20); overflow: hidden; display: grid; grid-template-columns: 230px 1fr">

<nav aria-label="Package categories" style="background: #F5F6FA; border-right: 1px solid #E1E4EE; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; gap: 8px; padding: 2px 6px 16px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #FF5F57"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #F5B83D"></span><span style="width: 14px; height: 14px; border-radius: 50%; background: #3DD68C"></span></div>
<label for="pk-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search packages</label>
<input id="pk-search" placeholder="Search packages" style="height: 40px; padding: 0 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #E1E4EE; background: #FFFFFF; color: #161A2B; font: inherit; font-size: 14px">
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: #FFE3D9; color: #161A2B; font: inherit; font-size: 14px; font-weight: 700; text-align: left">Discover</button>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; text-align: left">Make &amp; create</button>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; text-align: left">Developer tools</button>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; text-align: left">Games</button>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; text-align: left">Internet</button>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; text-align: left">Themes &amp; icons</button>
<div style="height: 1px; background: #E1E4EE; margin: 10px 6px"></div>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; text-align: left">Installed</button>
<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; display: flex; align-items: center; justify-content: space-between">Updates<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FF7A59; color: #2A120A; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span></button>
</nav>

<main style="padding: 26px 30px; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
<div style="position: relative; height: 210px; border-radius: 24px; background: #151B2E; color: #EEF1FA; overflow: hidden; display: flex; align-items: center; padding: 0 36px; gap: 32px">
<div style="position: absolute; width: 420px; height: 420px; right: -80px; top: -160px; border-radius: 50%; background: #FF7A59; opacity: 0.55; filter: blur(70px)"></div>
<div style="position: absolute; width: 360px; height: 360px; right: 260px; bottom: -220px; border-radius: 50%; background: #7B61FF; opacity: 0.55; filter: blur(70px)"></div>
<div style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #FF9A76">Editor’s pick</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1">Paint, but make it pixel.</span>
<span style="font-size: 15px; color: #D5DAEA; max-width: 440px">The new Paint brings layers, a pixel grid and palette swaps. Free, and made for CareOS.</span>
</div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px">
<dc-import name="AppIcon" app="paint" size="96" hint-size="96px,96px"></dc-import>
<button style="height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: #FFFFFF; color: #161A2B; font: inherit; font-weight: 800">Get</button>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Popular this week</h2>
<a href="#" style="font-size: 14px; font-weight: 700; color: #4F5EF2; text-decoration: none">See all</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{pkgs}}" as="p" hint-placeholder-count="6">
<div style="padding: 14px; border-radius: 18px; border: 1px solid #E1E4EE; display: flex; align-items: center; gap: 14px">
<dc-import name="AppIcon" app="{{p.app}}" size="56" hint-size="56px,56px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 15px">{{p.name}}</span>
<span style="font-size: 13px; color: #5A6178; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.desc}}</span>
</div>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: {{p.btnBg}}; color: {{p.btnFg}}; font: inherit; font-size: 13px; font-weight: 800">{{p.action}}</button>
</div>
</sc-for>
</div>
</section>

<section style="padding: 14px 16px; border-radius: 18px; background: #F5F6FA; display: flex; align-items: center; gap: 14px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FF7A59; color: #2A120A; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">3 updates ready</span><span style="font-size: 13px; color: #5A6178">Browser 2.4, Editor 1.9 and the Wi-Fi driver. About 18 MB.</span></span>
<button style="height: 40px; padding: 0 18px; border-radius: 12px; border: 0; background: #161A2B; color: #FFFFFF; font: inherit; font-weight: 700">Update all</button>
</section>
</main>
</div>

<div style="position: absolute; left: 340px; top: 796px">
<dc-import name="Dock" theme="light" active="store" running="terminal,files" hint-size="760px,96px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['music', 'Music', 'Radio, playlists and your files', 'Get'],
      ['games', 'Maze 3D', 'Find your way out, fast', 'Get'],
      ['photos', 'Photos', 'Browse and edit your pictures', 'Open'],
      ['mail', 'Mail', 'One inbox for every account', 'Get'],
      ['netmon', 'NetMon', 'Live network graphs', 'Open'],
      ['calendar', 'Calendar', 'Days, reminders and events', 'Get']
    ];
    return {
      pkgs: list.map(function (p) {
        var open = p[3] === 'Open';
        return { app: p[0], name: p[1], desc: p[2], action: p[3], btnBg: open ? '#EEF0F6' : '#FFE3D9', btnFg: open ? '#161A2B' : '#9A3412' };
      })
    };
  }
}
</script>
</body>
</html>
