<button style="height: 40px; padding: 0 12px; border-radius: 11px; border: 0; background: transparent; color: #161A2B; font: inherit; font-size: 14px; display: flex; justify-content: space-between; align-items: center">Ideas<span style="font-size: 12px; color: #5A6178">7</span></button>

<div style="border-right: 1px solid #E1E4EE; display: flex; flex-direction: column">

<div style="padding: 10px; display: flex; flex-direction: column; gap: 4px">

<button style="padding: 12px 14px; border-radius: 14px; border: 0; background: transparent; color: #161A2B; font: inherit; display: flex; flex-direction: column; gap: 4px; text-align: left"><span style="font-weight: 700; font-size: 15px">Care language ideas</span><span style="font-size: 13px; color: #5A6178">Yesterday · for-loops, lists, imports</span></button>
<button style="padding: 12px 14px; border-radius: 14px; border: 0; background: transparent; color: #161A2B; font: inherit; display: flex; flex-direction: column; gap: 4px; text-align: left"><span style="font-weight: 700; font-size: 15px">Pip outfits wishlist</span><span style="font-size: 13px; color: #5A6178">Thu · raincoat, chef hat, tiny backpack</span></button>
<button style="padding: 12px 14px; border-radius: 14px; border: 0; background: transparent; color: #161A2B; font: inherit; display: flex; flex-direction: column; gap: 4px; text-align: left"><span style="font-weight: 700; font-size: 15px">Scheduler rewrite</span><span style="font-size: 13px; color: #5A6178">Tue · round robin → priority queues</span></button>
<button style="padding: 12px 14px; border-radius: 14px; border: 0; background: transparent; color: #161A2B; font: inherit; display: flex; flex-direction: column; gap: 4px; text-align: left"><span style="font-weight: 700; font-size: 15px">Wallpaper pack</span><span style="font-size: 13px; color: #5A6178">Sep 28 · blobs, rings, night sky</span></button>
</div>

<button aria-label="Italic" style="width: 36px; height: 34px; border-radius: 9px; border: 0; background: transparent; font: inherit; font-style: italic; font-weight: 600; color: #161A2B">I</button>
<button aria-label="Heading" style="width: 36px; height: 34px; border-radius: 9px; border: 0; background: transparent; font: inherit; font-weight: 800; color: #161A2B">H</button>

<span style="font-size: 13px; color: #5A6178">Saturday, October 3 · 9:28 AM</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">v9.1 launch list</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #33394F; max-width: 620px">Everything that needs to land before the weekend. Pip gets top billing.</p>
<div style="display: flex; flex-direction: column; gap: 12px; font-size: 17px">
<label style="display: flex; align-items: center; gap: 12px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #F5AE2E"><span style="text-decoration: line-through; color: #6A7189">Fix Wi-Fi driver timeout</span></label>
<label style="display: flex; align-items: center; gap: 12px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #F5AE2E"><span style="text-decoration: line-through; color: #6A7189">New login + onboarding</span></label>
<label style="display: flex; align-items: center; gap: 12px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #F5AE2E">Pip: all nine moods + roaming</label>
<label style="display: flex; align-items: center; gap: 12px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #F5AE2E">Notes sync between users</label>
<label style="display: flex; align-items: center; gap: 12px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #F5AE2E">Write release notes</label>

<blockquote style="margin: 8px 0 0; padding: 14px 18px; border-radius: 14px; background: #FFF8E3; font-size: 16px; line-height: 1.55; color: #4A3A10">Keep it friendly. If something goes wrong, the OS should say what happened and what to try next.</blockquote>
</article>
</div>

<div style="position: absolute; left: 340px; top: 796px">
