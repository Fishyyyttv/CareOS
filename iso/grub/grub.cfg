insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

insmod all_video
insmod font

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod gfxterm
    set gfxmode="1920x1080x32,1920x1080,1280x720,auto"
    terminal_input console
    terminal_output gfxterm
fi

set menu_color_normal=light-blue/black
set menu_color_highlight=white/blue

# CareOS GRUB theme
if [ -d /boot/grub/themes/careos ]; then
    set theme=/boot/grub/themes/careos/theme.txt
    export theme
fi

set default=0
set timeout=8
set timeout_style=menu

menuentry "CareOS Live Desktop" {
    set gfxpayload=1920x1080x32,1920x1080,keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux \
        archisobasedir=%INSTALL_DIR% \
        archisolabel=%ARCHISO_LABEL% \
        quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 \
        careos.live=1 \
        video=1920x1080
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "CareOS Live Desktop (safe graphics)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux \
        archisobasedir=%INSTALL_DIR% \
        archisolabel=%ARCHISO_LABEL% \
        careos.live=1 \
        nomodeset
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "CareOS Live Desktop (copy to RAM)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux \
        archisobasedir=%INSTALL_DIR% \
        archisolabel=%ARCHISO_LABEL% \
        quiet splash careos.live=1 copytoram
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "CareOS Hardware Check (Memtest86+)" {
    linux /boot/memtest86+/memtest.bin
}

menuentry "Reboot" {
    reboot
}

menuentry "Shut down" {
    halt
}
