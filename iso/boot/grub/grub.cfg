insmod part_gpt
insmod part_msdos
insmod iso9660
insmod all_video
insmod font
insmod gfxterm
insmod multiboot2

set gfxmode=1920x1080x32,1920x1080,1280x720,auto
set gfxpayload=1920x1080x32,1920x1080,keep

set default=0
set timeout=3

menuentry "CareOS (1920x1080 Full HD)" {
    multiboot2 /boot/kernel.elf
    boot
}

